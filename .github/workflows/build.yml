name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      - name: Publish the bare APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OldMenu.apk
          gh release create "v${{ github.run_number }}" OldMenu.apk --title "Old Menu build ${{ github.run_number }}" --notes "Sideload with adb install -r OldMenu.apk. Uninstall the old version before installing a new build."
