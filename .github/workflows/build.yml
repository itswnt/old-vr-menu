name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Restore your private signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/my.jks
      - run: gradle assembleRelease
        env:
          KS_FILE: ${{ runner.temp }}/my.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: mykey
      - name: Publish the bare APK as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/release/app-release.apk OldMenu.apk
          gh release create "v${{ github.run_number }}" OldMenu.apk --title "Old Menu build ${{ github.run_number }}" --notes "Sideload with adb install -r OldMenu.apk"
